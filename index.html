<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<meta name="description" content="Dice Dungeon Duel — duel tactique de dés et de monstres, jouable sur mobile et hors-ligne.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dice Dungeon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=9.0.0">
<title>Dice Dungeon Duel</title>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- MENU -->
<section id="menu" class="screen">
  <div class="menuWrap">
    <header class="hero">
      <div class="heroFan" id="heroFan" aria-hidden="true"></div>
      <h1 class="logo">Dice Dungeon</h1>
      <p class="tagline">Lance · Invoque · Assiège</p>
    </header>
    <div class="profile">
      <span class="lvl">Niv. <b id="pfLevel">1</b></span>
      <div class="pfMain"><div class="bar"><i id="pfBar"></i></div><div class="pfRow"><span id="pfNext"></span><span id="pfXp"></span></div></div>
    </div>
    <button class="btn primary big hidden" id="mResume">Reprendre le duel</button>
    <button class="btn primary big storyBtn" id="mStory"><span class="sbIco">📖</span><span class="sbTxt"><b>Histoire</b><small id="mStorySub"></small></span></button>
    <button class="dailyCard" id="mDaily"><span class="dIco">📅</span><span class="grow"><b>Défi du jour</b><small id="mDailySub"></small></span><em id="mDailyStreak"></em></button>
    <div class="modeRow">
      <button class="modeBtn" id="mQuick"><i>⚔</i><b>Duel rapide</b><span>Rival au hasard</span></button>
      <button class="modeBtn" id="mExp"><i>🗺</i><b>Expédition</b><span id="mExpSub"></span></button>
    </div>
    <div class="menuTiles four">
      <button class="tileBtn" id="mTuto"><i>🎓</i><b>Tutoriel</b></button>
      <button class="tileBtn" id="mCampaign"><i>◆</i><b>Campagne</b><span id="mCampSub"></span></button>
      <button class="tileBtn" id="mDeck"><i>▣</i><b>Deck</b></button>
      <button class="tileBtn" id="mAch"><i>🏅</i><b>Succès</b><span id="mAchSub"></span></button>
    </div>
    <nav class="menuFoot">
      <button class="linkBtn" id="mRules">Règles</button>
      <button class="linkBtn" id="mSettings">Réglages</button>
      <button class="linkBtn hidden" id="mInstall">Installer le jeu</button>
    </nav>
  </div>
</section>

<!-- HISTOIRE -->
<section id="story" class="screen hidden">
  <header class="screenHead">
    <button class="btn small" data-back>← Menu</button>
    <h1 class="title">Histoire</h1>
    <span class="pill" id="stStars"></span>
  </header>
  <div id="stActs" class="acts"></div>
</section>

<!-- CAMPAGNE -->
<section id="campaign" class="screen hidden">
  <header class="screenHead">
    <button class="btn small" data-back>← Menu</button>
    <h1 class="title">La route du donjon</h1>
    <span class="pill" id="cpWins"></span>
  </header>
  <p class="intro muted">Sept duels, chacun avec un rival, une arène et une identité tactique. Progression sauvegardée automatiquement.</p>
  <div id="cpPath" class="missionList"></div>
  <div class="center"><button class="btn red small" id="cpReset">Réinitialiser la campagne</button></div>
</section>

<!-- DECK -->
<section id="deck" class="screen hidden">
  <header class="screenHead sticky">
    <button class="btn small" id="dkBack">← Menu</button>
    <div class="dkCounts"><span class="pill" id="dkM"></span><span class="pill" id="dkE"></span></div>
    <button class="btn gold small" id="dkSave">Sauvegarder</button>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="collection">Collection</button>
    <button class="tab" data-tab="mine">Mon deck <b id="dkTotal"></b></button>
    <button class="tab" data-tab="analysis">Analyse</button>
  </div>
  <div class="dkPane" data-pane="collection">
    <div class="presetRow" id="dkPresets"></div>
    <div class="filters">
      <div class="seg" id="dkType"><button data-v="all" class="on">Tout</button><button data-v="monster">Monstres</button><button data-v="effect">Effets</button></div>
      <select id="dkFamily"><option value="all">Toutes familles</option></select>
      <input id="dkSearch" type="search" placeholder="Rechercher…">
    </div>
    <div id="dkCollection" class="cardGrid"></div>
  </div>
  <div class="dkPane hidden" data-pane="mine">
    <div id="dkIssues" class="notice"></div>
    <div id="dkList" class="deckList"></div>
    <div class="center"><button class="btn small" id="dkClear">Vider le deck</button></div>
  </div>
  <div class="dkPane hidden" data-pane="analysis"><div id="dkAnalysis"></div></div>
</section>

<!-- DUEL -->
<section id="battle" class="screen hidden">
  <header class="topbar">
    <button class="iconBtn" id="bMenu" aria-label="Menu du duel">☰</button>
    <div class="duelist p"><span class="medal" id="pMedal"></span><div class="dmeta"><div class="dname" id="pName"></div><div class="hearts" id="pHearts"></div></div><b class="hpnum" id="pHp"></b></div>
    <div class="turnPill" id="turnPill"></div>
    <div class="duelist e"><b class="hpnum" id="eHp"></b><div class="dmeta"><div class="dname" id="eName"></div><div class="hearts" id="eHearts"></div></div><span class="medal" id="eMedal"></span></div>
  </header>
  <div class="crestBar" id="crests"></div>
  <div class="boardWrap" id="boardWrap">
    <div class="boardScroll" id="boardScroll"><div class="board" id="board"></div></div>
    <div class="fxLayer" id="fxLayer"></div>
  </div>
  <div class="side">
    <div class="prompt hidden" id="prompt"><span id="promptText"></span><button class="btn small" id="promptCancel">Annuler</button></div>
    <div class="ticker" id="ticker"></div>
    <div class="log sideLog" id="sideLog"></div>
    <div class="context" id="context"></div>
    <div class="handRow"><div class="hand" id="hand"></div></div>
    <nav class="actionBar">
      <button class="act" id="aSummon"><b>◇</b><span>Invoquer</span><em id="aSummonN"></em></button>
      <button class="act" id="aTactics"><b>◆</b><span>Tactique</span></button>
      <button class="act main" id="aRoll"><b>🎲</b><span>Lancer les dés</span></button>
      <button class="act main end hidden" id="aEnd"><b>▶</b><span>Fin du tour</span></button>
    </nav>
  </div>
</section>

<!-- fenêtre générique (fiches, choix, réglages, résultats) -->
<div id="sheet" class="sheet hidden" aria-hidden="true">
  <div class="sheetPanel panel" role="dialog" aria-modal="true">
    <button class="sheetClose iconBtn" id="sheetClose" aria-label="Fermer">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="diceOverlay" class="diceOverlay hidden" aria-hidden="true">
  <div class="dicePanel panel"><div class="diceTitle" id="diceTitle"></div><div class="diceRow" id="diceRow"></div><div class="small muted">Touchez pour passer</div></div>
</div>
<div id="dialog" class="dialog hidden"></div>
<div id="banner" class="banner"></div>
<div id="toast" class="toast"></div>

<script src="js/data.js?v=9.0.0"></script>
<script src="js/art.js?v=9.0.0"></script>
<script src="js/engine.js?v=9.0.0"></script>
<script src="js/ai.js?v=9.0.0"></script>
<script src="js/store.js?v=9.0.0"></script>
<script src="js/story.js?v=9.0.0"></script>
<script src="js/meta.js?v=9.0.0"></script>
<script src="js/audio.js?v=9.0.0"></script>
<script src="js/ui.js?v=9.0.0"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // une nouvelle version prend la main : on recharge une fois pour ne pas mélanger deux versions
  let reloaded = false, hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {}));
}
</script>
</body>
</html>
